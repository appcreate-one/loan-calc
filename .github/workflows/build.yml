name: Build H2H APKs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - { name: "H2H RO", file: "index.html", icon: "RO_H2H_512.png", id: "ro", pkg: "com.h2h.ro" }
          - { name: "H2H BCM", file: "bcm.html", icon: "BCM_H2H_512.png", id: "bcm", pkg: "com.h2h.bcm" }
          - { name: "H2H BRM", file: "brm.html", icon: "BRM_H2H_512.png", id: "brm", pkg: "com.h2h.brm" }
          - { name: "H2H Head Office", file: "owner.html", icon: "HO_H2H_512.png", id: "owner", pkg: "com.h2h.owner" }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare web folder
        run: |
          mkdir -p www
          cp "${{ matrix.app.file }}" www/index.html
          cp h2h.css www/
          cp *_H2H_512.png www/ || true
          cp manifest-*.json www/ || true

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "${{ matrix.app.name }}" "${{ matrix.app.pkg }}" --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Set launcher icon
        run: |
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y imagemagick >/dev/null
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d=${pair%%:*}; s=${pair##*:}
            mkdir -p $RES/mipmap-$d
            convert "${{ matrix.app.icon }}" -resize ${s}x${s} $RES/mipmap-$d/ic_launcher.png
            cp $RES/mipmap-$d/ic_launcher.png $RES/mipmap-$d/ic_launcher_round.png
          done

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app.id }}-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
