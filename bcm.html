<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ea580c">
<link rel="manifest" href="manifest-bcm.json">
<link rel="icon" href="BCM_H2H_512.png">
<link rel="apple-touch-icon" href="BCM_H2H_512.png">
<title>H2H BCM</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { overflow-x: hidden; }
  body { font-family: "Segoe UI", Roboto, Arial, sans-serif; background: #eef3fb; color: #0f172a; padding-bottom: 96px; font-size: 15px; }
  button, input, select { font-family: inherit; }

  /* Header */
  .bh { background: linear-gradient(100deg, #f97316 0%, #ea580c 28%, #1e40af 62%, #1d4ed8 100%); color: #fff; padding: 12px 14px 14px; position: relative; overflow: visible; }
  .bh-row { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
  .logo { width: 62px; height: 62px; border-radius: 14px; background: #fff; border: 3px solid #fff; overflow: hidden; flex: none; box-shadow: 0 6px 14px rgba(0,0,0,0.25); }
  .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ttl { flex: 1; min-width: 0; }
  .ttl h1 { font-size: 17px; font-weight: 800; letter-spacing: 1.5px; white-space: nowrap; }
  .hsub { font-size: 13px; font-weight: 600; margin-top: 4px; line-height: 1.5; opacity: 0.97; }
  .hsub span { display: inline-flex; align-items: center; gap: 4px; }
  .syncBox { background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.35); border-radius: 14px; padding: 8px 10px; display: flex; align-items: center; gap: 8px; position: relative; flex: none; }
  .syncBox small { display: block; font-size: 11px; opacity: 0.95; }
  .syncBox b { display: block; font-size: 14px; }
  .gd { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: #22c55e; }
  .bell { position: relative; width: 46px; height: 46px; border-radius: 14px; border: 1.5px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.12); display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
  .bn { position: absolute; top: -6px; right: -6px; min-width: 22px; height: 22px; border-radius: 50%; background: #ef4444; color: #fff; font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; border: 2px solid #1d4ed8; }
  .bn.zero { display: none; }
  .menuBtn { background: none; border: none; padding: 2px; cursor: pointer; flex: none; }

  /* Layout */
  .wrap { padding: 12px 12px 0; }
  .card { background: #fff; border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: 0 8px 18px rgba(11,18,32,0.07); }
  .h2 { font-size: 16px; font-weight: 800; color: #0f172a; display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .h2 small { font-size: 12px; color: #475569; font-weight: 600; }
  .note { font-size: 13px; color: #475569; line-height: 1.5; }

  /* KPI cards */
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 10px; }
  .kc { border-radius: 16px; padding: 10px 4px; text-align: center; border: 1.5px solid; background: #fff; }
  .kc .ic { width: 32px; height: 32px; border-radius: 50%; margin: 0 auto 4px; display: flex; align-items: center; justify-content: center; color: #fff; }
  .kc .n { font-size: 22px; font-weight: 800; line-height: 1.1; }
  .kc .l { font-size: 11px; font-weight: 800; }
  .kc .t { font-size: 11px; font-weight: 600; color: #475569; margin-top: 2px; }
  .k-tot { border-color: #fecaca; background: #fff7f5; } .k-tot .n, .k-tot .l { color: #b91c1c; }
  .k-pen { border-color: #fde68a; background: #fffbeb; } .k-pen .n, .k-pen .l { color: #b45309; }
  .k-ver { border-color: #bfdbfe; background: #f5f9ff; } .k-ver .n, .k-ver .l { color: #1d4ed8; }
  .k-pas { border-color: #bbf7d0; background: #f2fdf6; } .k-pas .n, .k-pas .l { color: #15803d; }
  .k-rej { border-color: #fecaca; background: #fff5f5; } .k-rej .n, .k-rej .l { color: #b91c1c; }
  .ic-o { background: #f97316; } .ic-a { background: #f59e0b; } .ic-b { background: #2563eb; } .ic-g { background: #16a34a; } .ic-r { background: #dc2626; }

  /* Amount cards */
  .amts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .ac { background: #fff; border-radius: 18px; padding: 12px; box-shadow: 0 8px 18px rgba(11,18,32,0.07); display: flex; gap: 10px; align-items: center; }
  .ac .ico { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; flex: none; font-size: 20px; font-weight: 800; }
  .ac .lab { font-size: 13px; font-weight: 700; color: #0f172a; line-height: 1.25; }
  .ac .val { font-size: 19px; font-weight: 800; margin-top: 2px; }
  .ac .sub { font-size: 11px; color: #475569; font-weight: 600; }
  .ac.full { grid-column: 1 / -1; }

  /* Charts */
  .charts { display: grid; grid-template-columns: 1fr; gap: 10px; margin-bottom: 12px; }
  .donutRow { display: flex; align-items: center; gap: 12px; }
  .donut { width: 128px; height: 128px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; }
  .donut span { width: 80px; height: 80px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: #475569; font-weight: 600; }
  .donut span b { font-size: 16px; color: #0f172a; }
  .legend { flex: 1; font-size: 13px; }
  .legend div { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 6px; align-items: center; padding: 4px 0; }
  .legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .legend b { font-weight: 800; }
  .legend small { color: #475569; font-weight: 700; }
  .ro { display: grid; grid-template-columns: 26px 1fr 94px; gap: 8px; align-items: center; padding: 6px 0; font-size: 14px; }
  .rank { width: 24px; height: 24px; border-radius: 50%; border: 2px solid #cbd5e1; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #475569; }
  .rank.r1 { border-color: #f59e0b; background: #fff7e6; color: #b45309; }
  .rank.r2 { border-color: #94a3b8; color: #334155; }
  .rank.r3 { border-color: #d97706; color: #92400e; }
  .bar { height: 14px; border-radius: 999px; background: #e8eef7; overflow: hidden; }
  .bar div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, #3b82f6, #1d4ed8); }
  .ro .amt { text-align: right; font-weight: 800; }

  /* Filter pills, search and dropdowns */
  .fpills { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; }
  .fp { display: inline-flex; align-items: center; gap: 6px; background: #fff; border: 1px solid #e2e8f0; color: #0f172a; border-radius: 999px; padding: 9px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; box-shadow: 0 2px 8px rgba(11,18,32,0.06); cursor: pointer; }
  .fp.on { background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; border-color: transparent; }
  .frow { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 10px; }
  .search { display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 0 12px; height: 46px; }
  .search input { border: none; outline: none; flex: 1; font-size: 15px; background: transparent; min-width: 0; }
  .dds { display: grid; grid-template-columns: 1fr 1fr 1fr 46px; gap: 6px; }
  .dds select { height: 46px; border: 1px solid #e2e8f0; border-radius: 14px; background: #fff; padding: 0 8px; font-size: 13px; font-weight: 600; color: #0f172a; min-width: 0; }
  .fbtn { height: 46px; width: 46px; border-radius: 14px; border: none; background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  /* Table */
  .tw { overflow-x: auto; background: #fff; border-radius: 18px; box-shadow: 0 8px 18px rgba(11,18,32,0.07); margin-bottom: 14px; }
  table.t { width: 100%; border-collapse: collapse; min-width: 760px; font-size: 13px; }
  table.t th { background: #1d4ed8; color: #fff; font-size: 12px; font-weight: 800; text-align: left; padding: 10px 6px; }
  table.t td { padding: 9px 6px; border-bottom: 1px solid #e8eef7; vertical-align: middle; }
  table.t td b { display: block; font-size: 14px; }
  table.t td small { display: block; color: #475569; font-size: 12px; }
  .chip { display: inline-block; padding: 4px 9px; border-radius: 8px; font-weight: 800; font-size: 12px; }
  .sp { display: inline-flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 12px; font-weight: 800; font-size: 12px; }
  .s-Pending { background: #fef3c7; color: #92400e; }
  .s-Assigned { background: #ede9fe; color: #5b21b6; }
  .s-Verified { background: #dbeafe; color: #1e40af; }
  .s-Passed { background: #dcfce7; color: #166534; }
  .s-Rejected { background: #fee2e2; color: #991b1b; }
  .ib { border: 1.5px solid #bfdbfe; background: #fff; color: #1d4ed8; border-radius: 10px; padding: 6px 8px; display: inline-flex; cursor: pointer; margin-right: 6px; }
  .ic-ph { color: #64748b; }

  /* Client list cards (+ and Clients) */
  .cli { background: #fff; border-radius: 18px; padding: 14px; margin-bottom: 12px; box-shadow: 0 8px 18px rgba(11,18,32,0.07); }
  .cli .top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
  .cli .top b { display: block; font-size: 16px; }
  .cli .top small { color: #475569; font-size: 13px; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chipS { font-size: 12px; font-weight: 800; padding: 6px 10px; border-radius: 999px; border: 1.5px solid #e2e8f0; color: #64748b; background: #f8fafc; }
  .chipS.on.Verified { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
  .chipS.on.Assigned { background: #ede9fe; color: #5b21b6; border-color: #c4b5fd; }
  .chipS.on.Passed { background: #dcfce7; color: #166534; border-color: #86efac; }
  .chipS.on.Rejected { background: #fee2e2; color: #991b1b; border-color: #fca5a5; }
  .chipS.on.Pending { background: #fef3c7; color: #92400e; border-color: #fcd34d; }
  .kv { display: grid; grid-template-columns: 1fr; margin-top: 10px; font-size: 14px; }
  .kv div { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed #e2e8f0; }
  .kv span { color: #475569; font-weight: 600; }
  .kv b { text-align: right; color: #0f172a; }
  .openBtn { width: 100%; margin-top: 10px; border: none; border-radius: 12px; padding: 12px; font-weight: 800; font-size: 15px; color: #fff; background: linear-gradient(135deg, #f97316, #ea580c); cursor: pointer; }
  .moreBtn { width: 100%; margin-top: 8px; border: 1.5px solid #cbd5e1; background: #fff; border-radius: 12px; padding: 10px; font-weight: 800; color: #1d4ed8; cursor: pointer; }

  /* Detail screen */
  .overlay { position: fixed; inset: 0; background: #eef3fb; z-index: 80; overflow-y: auto; padding-bottom: 30px; }
  .dh { background: linear-gradient(100deg, #f97316, #ea580c 30%, #1d4ed8); color: #fff; padding: 14px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 2; }
  .dh b { font-size: 17px; flex: 1; }
  .dbody { padding: 12px; }
  .dname { background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 8px 18px rgba(11,18,32,0.07); margin-bottom: 10px; }
  .dname b { font-size: 19px; display: block; }
  .dname small { font-size: 14px; color: #475569; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 12px 0; }
  .ab { border: none; border-radius: 14px; padding: 13px 8px; font-weight: 800; font-size: 15px; color: #fff; cursor: pointer; }
  .ab.full { width: 100%; margin-top: 8px; }
  .ab.ver { background: linear-gradient(135deg, #1d4ed8, #3b82f6); }
  .ab.asg { background: linear-gradient(135deg, #6d28d9, #8b5cf6); }
  .ab.pas { background: linear-gradient(135deg, #15803d, #22c55e); }
  .ab.rej { background: linear-gradient(135deg, #b91c1c, #ef4444); }
  .panel { background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 8px 18px rgba(11,18,32,0.07); margin-bottom: 12px; }
  .panel label { display: block; font-size: 13px; font-weight: 800; color: #0f172a; margin: 8px 0 6px; }
  .panel select, .panel input { width: 100%; height: 46px; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 0 10px; font-size: 16px; background: #fff; }
  .res { border-radius: 14px; padding: 12px; font-weight: 800; font-size: 15px; margin: 10px 0; }
  .res.ok { background: #dcfce7; color: #166534; }
  .res.bad { background: #fee2e2; color: #991b1b; }
  .msgE { color: #b91c1c; font-size: 14px; font-weight: 700; margin-top: 8px; min-height: 18px; }

  /* Login */
  .login { max-width: 420px; margin: 40px auto; padding: 0 14px; }
  .login .card input { width: 100%; height: 48px; border: 1.5px solid #cbd5e1; border-radius: 12px; padding: 0 12px; font-size: 16px; margin-bottom: 10px; }
  .login .card label { display: block; font-size: 13px; font-weight: 800; color: #475569; margin: 4px 0 4px; }
  .btnFull { width: 100%; height: 50px; border: none; border-radius: 14px; font-weight: 800; font-size: 16px; color: #fff; background: linear-gradient(135deg, #f97316, #1d4ed8); cursor: pointer; margin-top: 6px; }

  /* Bottom bar */
  .bnav { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; box-shadow: 0 -8px 22px rgba(11,18,32,0.12); display: flex; justify-content: space-around; align-items: flex-end; padding: 8px 6px 10px; z-index: 40; }
  .bnav button { background: none; border: none; font-size: 12px; font-weight: 700; color: #475569; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 6px 8px; min-width: 58px; cursor: pointer; }
  .bnav button.on { color: #fff; background: linear-gradient(135deg, #f97316, #ea580c); border-radius: 14px; }
  .bnav button.plus { color: #ea580c; margin-top: -28px; }
  .bnav .fab { width: 64px; height: 64px; border-radius: 50%; background: linear-gradient(135deg, #f97316, #ea580c); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 20px rgba(234,88,12,0.4); }

  @media (max-width: 380px) {
    .kc .n { font-size: 19px; }
    .kc .l, .kc .t { font-size: 10px; }
    .ac .val { font-size: 16px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login" id="login">
  <div class="card" style="background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 18px rgba(11,18,32,0.07)">
    <div style="text-align:center;margin-bottom:12px"><img src="BCM_H2H_512.png" alt="H2H BCM" style="width:90px;height:90px;border-radius:18px"></div>
    <h2 style="font-size:18px;margin-bottom:10px;text-align:center">BCM login</h2>
    <label>Branch name</label><input id="aBranch" type="text">
    <label>Staff name</label><input id="aName" type="text">
    <label>Password</label><input id="aPass" type="password">
    <button class="btnFull" onclick="login()">Login</button>
    <div id="aMsg" class="msgE"></div>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none">
  <header class="bh">
    <div class="bh-row">
      <button class="menuBtn" onclick="setView('more')"><span data-ico="menu" data-size="28" data-color="#fff"></span></button>
      <div class="logo"><img src="BCM_H2H_512.png" alt="H2H BCM"></div>
      <div class="ttl">
        <h1>H2H &middot; VERIFICATION</h1>
        <div class="hsub" id="hsub"></div>
      </div>
      <div class="syncBox">
        <span data-ico="refresh" data-size="22" data-color="#fff"></span>
        <div><small>Last Sync</small><b id="lastSync">-</b></div>
        <i class="gd"></i>
      </div>
      <button class="bell" onclick="setView('add')"><span data-ico="bell" data-size="24" data-color="#fff"></span><span class="bn zero" id="bn">0</span></button>
    </div>
  </header>

  <main class="wrap" id="view"></main>

  <nav class="bnav">
    <button id="nDash" class="on" onclick="setView('dash')"><span data-ico="home" data-size="24"></span><span>Dashboard</span></button>
    <button id="nCli" onclick="setView('clients')"><span data-ico="users" data-size="24"></span><span>Clients</span></button>
    <button id="nAdd" class="plus" onclick="setView('add')"><span class="fab" data-ico="plus" data-size="30" data-color="#fff"></span><span>Add Client</span></button>
    <button id="nRep" onclick="setView('reports')"><span data-ico="bar" data-size="24"></span><span>Reports</span></button>
    <button id="nMore" onclick="setView('more')"><span data-ico="grid" data-size="24"></span><span>More</span></button>
  </nav>
</div>

<!-- CLIENT DETAILS -->
<div class="overlay" id="detail" style="display:none"></div>

<script>
  // Only the web app URL goes here. No keys are stored in this page.
  const SYNC_URL = "https://script.google.com/macros/s/AKfycbxRCx6N62C3ke8ZVZDi_nNojd4F_DtUUEAh4LWu66LhCy7m-JuXeGKaaaKqjRuohEZi/exec";

  // Passed loan amount limits per product: [min, max, step for the dropdown]
  const PASS_RANGE = { IGL: [10000, 120000, 5000], IL: [10000, 300000, 5000], MSME: [100000, 1000000, 10000] };
  const DEFAULT_RANGE = [10000, 1000000, 5000];
  const REJECT_REASONS = ["Documents missing", "Income not verified", "House not verified", "Client not available", "Other"];

  // ---------- icons ----------
  const IC = {
    menu: '<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>',
    bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>',
    refresh: '<path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10"/><path d="M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>',
    file: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/>',
    hourglass: '<path d="M6 2h12"/><path d="M6 22h12"/><path d="M7 2v4a5 5 0 0 0 2 4 5 5 0 0 0-2 4v4"/><path d="M17 2v4a5 5 0 0 1-2 4 5 5 0 0 1 2 4v4"/>',
    check: '<circle cx="12" cy="12" r="10"/><polyline points="8 12 11 15 16 9"/>',
    xcirc: '<circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>',
    users: '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>',
    trend: '<polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/>',
    eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
    dots: '<circle cx="12" cy="5" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="19" r="1.8" fill="currentColor"/>',
    search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.7" y2="16.7"/>',
    filter: '<line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/>',
    home: '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
    plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
    bar: '<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>',
    grid: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
    pin: '<path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-1a7 7 0 0 1 14 0v1"/>',
    logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
    close: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>'
  };
  function ico(name, size = 20, color = "currentColor") {
    return `<svg viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex:none">${IC[name] || ""}</svg>`;
  }
  function applyIcons() {
    document.querySelectorAll("[data-ico]").forEach(el => {
      el.innerHTML = ico(el.getAttribute("data-ico"), Number(el.getAttribute("data-size")) || 20, el.getAttribute("data-color") || "currentColor");
    });
  }
  applyIcons();

  // ---------- helpers ----------
  let token = "", me = null, recs = [];
  let view = "dash", filter = "All", q = "", fRo = "", fProd = "", fStat = "";
  let detailId = null, lastSig = "", pending = false, autoTimer = null, autoBusy = false, lastTime = "-";
  const $ = id => document.getElementById(id);

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function rs(n) {
    if (n === "" || n === null || n === undefined) return "-";
    const v = Number(n);
    return isFinite(v) ? "\u20B9" + Math.round(v).toLocaleString("en-IN") : "-";
  }
  function fmt(s) {
    if (!s) return "-";
    const d = new Date(s);
    return isNaN(d) ? String(s) : d.toLocaleString("en-IN", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function todayKey() { const d = new Date(); return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function same(a, b) { return String(a).trim().toLowerCase() === String(b).trim().toLowerCase(); }

  function det(r) { return (r.Data && r.Data.data) || {}; }
  function cname(r) { return det(r).cname || r.Client || "-"; }
  function mobile(r) { return det(r).mobile || r.Mobile || ""; }
  function centerOf(r) { return det(r).center || r.Center || ""; }
  function prodOf(r) { return String(r.Product || det(r).product || r.Type || ""); }
  function statusOf(r) {
    if (r.Result === "Passed") return "Passed";
    if (r.Result === "Rejected") return "Rejected";
    return r.Status || "Pending";
  }
  function rangeOf(prod) { return PASS_RANGE[String(prod).toUpperCase()] || DEFAULT_RANGE; }
  function amountOptions(prod, selected) {
    const [min, max, step] = rangeOf(prod);
    let o = "";
    for (let v = min; v <= max; v += step) {
      o += `<option value="${v}" ${Number(selected) === v ? "selected" : ""}>${rs(v)}</option>`;
    }
    return o;
  }
  function isMine(r) { return !r["Assigned BCM"] || same(r["Assigned BCM"], me.staff); }

  // ---------- server ----------
  async function post(p) {
    if (SYNC_URL.startsWith("PASTE")) throw new Error("Set SYNC_URL in bcm.html first.");
    const res = await fetch(SYNC_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(Object.assign({ token: token }, p))
    });
    return res.json();
  }
  async function get(params) {
    const qs = Object.entries(Object.assign({ token: token }, params)).map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");
    return (await fetch(SYNC_URL + "?" + qs)).json();
  }

  // ---------- login ----------
  async function login() {
    const branch = $("aBranch").value.trim(), staff = $("aName").value.trim(), password = $("aPass").value;
    if (!branch || !staff || !password) { $("aMsg").textContent = "Fill in all fields."; return; }
    try {
      const res = await post({ action: "login", branch: branch, staff: staff, password: password });
      if (!res.ok) { $("aMsg").textContent = res.error; return; }
      if (res.role !== "BCM") { $("aMsg").textContent = "This login is not a BCM account."; return; }
      token = res.token;
      me = res;
      localStorage.setItem("bcm_session", JSON.stringify({ token: token, branch: me.branch, staff: me.staff, role: me.role }));
      await loadRecords();
      startApp();
    } catch (e) {
      $("aMsg").textContent = e.message || "Could not connect. Check internet.";
    }
  }

  function startApp() {
    $("login").style.display = "none";
    $("app").style.display = "block";
    $("hsub").innerHTML = `<span>${ico("pin", 14, "#fff")} Branch: ${esc(me.branch)} &nbsp;|&nbsp; ${ico("user", 14, "#fff")} BCM: ${esc(me.staff)}</span><br><span>${ico("calendar", 14, "#fff")} ${new Date().toLocaleString("en-IN", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" })}</span>`;
    applyIcons();
    render();
    if (!autoTimer) autoTimer = setInterval(autoSync, 3000);
  }

  function logout() {
    localStorage.removeItem("bcm_session");
    clearInterval(autoTimer);
    location.reload();
  }

  // ---------- data ----------
  async function loadRecords() {
    const r = await get({ action: "records" });
    if (!r.ok) throw new Error(r.error);
    const sig = JSON.stringify(r.records);
    const changed = sig !== lastSig;
    lastSig = sig;
    recs = r.records;
    lastTime = new Date().toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    return changed;
  }

  // Redraw only when the user isn't typing or viewing a client
  function busy() {
    if (detailId) return true;
    const a = document.activeElement;
    return !!(a && (a.tagName === "INPUT" || a.tagName === "SELECT" || a.tagName === "TEXTAREA"));
  }

  async function autoSync() {
    if (!me || autoBusy) return;
    autoBusy = true;
    try {
      if (await loadRecords()) pending = true;
      $("lastSync").textContent = lastTime;
      if (pending && !busy()) { pending = false; render(); }
    } catch (e) {
    } finally {
      autoBusy = false;
    }
  }

  async function manualSync() {
    try { await loadRecords(); pending = false; render(); }
    catch (e) { alert("Sync failed: " + e.message); }
  }

  // ---------- navigation ----------
  function setView(v) {
    view = v;
    ["Dash", "Cli", "Add", "Rep", "More"].forEach(n => $("n" + n).classList.remove("on"));
    const map = { dash: "nDash", clients: "nCli", add: "nAdd", reports: "nRep", more: "nMore" };
    if (map[v]) $(map[v]).classList.add("on");
    render();
    window.scrollTo(0, 0);
  }

  function render() {
    if (!me) return;
    $("lastSync").textContent = lastTime;
    const unseen = recs.filter(r => isMine(r) && statusOf(r) === "Assigned").length;
    $("bn").textContent = unseen;
    $("bn").classList.toggle("zero", unseen === 0);
    if (view === "dash") renderDash();
    else if (view === "add") renderAdd();
    else if (view === "clients") renderClients();
    else if (view === "reports") renderReports();
    else renderMore();
  }

  // ---------- DASHBOARD ----------
  function sumOf(list, f) { return list.reduce((s, r) => s + (Number(f(r)) || 0), 0); }

  function renderDash() {
    const t = todayKey();
    const todayRecs = recs.filter(r => String(r.Date || "") === t);
    const of = st => recs.filter(r => statusOf(r) === st);
    const passed = of("Passed"), rejected = of("Rejected");
    const pendingL = of("Pending"), assignedL = of("Assigned"), verifiedL = of("Verified");
    const tod = st => todayRecs.filter(r => statusOf(r) === st).length;

    const passedAmt = sumOf(passed, r => r["Passed Amount"]);
    const passedToday = sumOf(passed.filter(r => String(r.Date || "") === t), r => r["Passed Amount"]);
    const reqAll = sumOf(recs, r => r["Requested Amount"]);
    const reqToday = sumOf(todayRecs, r => r["Requested Amount"]);
    const decided = passed.length + rejected.length;
    const passRate = decided ? Math.round(passed.length / decided * 100) : 0;
    const avg = passed.length ? Math.round(passedAmt / passed.length) : 0;

    // Product donut: passed amount by product
    const prods = [["IGL", "#1d4ed8"], ["IL", "#f97316"], ["MSME", "#16a34a"]];
    const pAmts = prods.map(([p]) => sumOf(passed.filter(r => prodOf(r).toUpperCase() === p), r => r["Passed Amount"]));
    const pTot = pAmts.reduce((a, b) => a + b, 0);
    let acc = 0;
    const stops = prods.map(([p, c], i) => {
      const pct = pTot ? pAmts[i] / pTot * 100 : 0;
      const from = acc; acc += pct;
      return `${c} ${from}% ${acc}%`;
    });
    const donutBg = pTot ? `conic-gradient(${stops.join(", ")})` : "conic-gradient(#e5e7eb 0 100%)";
    const legend = prods.map(([p, c], i) => `
      <div><i style="background:${c}"></i><span>${p}</span><b>${rs(pAmts[i])}</b><small>(${pTot ? Math.round(pAmts[i] / pTot * 100) : 0}%)</small></div>`).join("");

    // RO performance: passed amount per RO
    const roNames = [...new Set(recs.map(r => r.Staff).filter(Boolean))];
    const roRows = roNames.map(n => ({ name: n, amt: sumOf(passed.filter(r => same(r.Staff, n)), r => r["Passed Amount"]) }))
      .sort((a, b) => b.amt - a.amt).slice(0, 6);
    const rmax = Math.max(1, ...roRows.map(x => x.amt));
    const roHtml = roRows.map((x, i) => `
      <div class="ro">
        <span class="rank ${i === 0 ? "r1" : i === 1 ? "r2" : i === 2 ? "r3" : ""}">${i + 1}</span>
        <div><div style="font-weight:700;margin-bottom:4px">${esc(x.name)}</div><div class="bar"><div style="width:${Math.round(x.amt / rmax * 100)}%"></div></div></div>
        <span class="amt">${rs(x.amt)}</span>
      </div>`).join("") || `<p class="note">No passed files yet.</p>`;

    // Filter pills
    const fp = (name, n) => `<button class="fp ${filter === name ? "on" : ""}" onclick="setFilter('${name}')">${name} (${n})</button>`;
    const counts = { All: recs.length, Pending: pendingL.length, Assigned: assignedL.length, Verified: verifiedL.length, Passed: passed.length, Rejected: rejected.length };

    const roList = roNames.slice().sort();
    const prodList = ["IGL", "IL", "MSME"];

    $("view").innerHTML = `
      <div class="kpis">
        <div class="kc k-tot"><div class="ic ic-o">${ico("file", 18, "#fff")}</div><div class="n">${recs.length}</div><div class="l">Total Clients</div><div class="t">Today: ${todayRecs.length}</div></div>
        <div class="kc k-pen"><div class="ic ic-a">${ico("hourglass", 18, "#fff")}</div><div class="n">${pendingL.length}</div><div class="l">Pending</div><div class="t">Today: ${tod("Pending")}</div></div>
        <div class="kc k-ver"><div class="ic ic-b">${ico("check", 18, "#fff")}</div><div class="n">${verifiedL.length}</div><div class="l">Verified</div><div class="t">Today: ${tod("Verified")}</div></div>
        <div class="kc k-pas"><div class="ic ic-g">${ico("check", 18, "#fff")}</div><div class="n">${passed.length}</div><div class="l">Passed</div><div class="t">Today: ${tod("Passed")}</div></div>
        <div class="kc k-rej"><div class="ic ic-r">${ico("xcirc", 18, "#fff")}</div><div class="n">${rejected.length}</div><div class="l">Rejected</div><div class="t">Today: ${tod("Rejected")}</div></div>
      </div>

      <div class="amts">
        <div class="ac"><div class="ico" style="background:#16a34a">₹</div><div><div class="lab">Total Passed Loan Amount</div><div class="val" style="color:#15803d">${rs(passedAmt)}</div><div class="sub">Today: ${rs(passedToday)}</div></div></div>
        <div class="ac"><div class="ico" style="background:#2563eb">${ico("file", 22, "#fff")}</div><div><div class="lab">Requested Loan Amount</div><div class="val" style="color:#1d4ed8">${rs(reqAll)}</div><div class="sub">Today: ${rs(reqToday)}</div></div></div>
        <div class="ac"><div class="ico" style="background:#f97316">${ico("trend", 22, "#fff")}</div><div><div class="lab">Pass Rate</div><div class="val" style="color:#ea580c">${passRate}%</div><div class="sub">${passed.length} / ${decided} decided</div></div></div>
        <div class="ac"><div class="ico" style="background:#7c3aed">${ico("users", 22, "#fff")}</div><div><div class="lab">Avg Loan Amount</div><div class="val" style="color:#5b21b6">${rs(avg)}</div><div class="sub">Per client (passed)</div></div></div>
      </div>

      <div class="charts">
        <div class="card">
          <div class="h2">Product Wise Passed Amount</div>
          <div class="donutRow">
            <div class="donut" style="background:${donutBg}"><span><b>${rs(pTot)}</b>Total</span></div>
            <div class="legend">${legend}</div>
          </div>
        </div>
        <div class="card">
          <div class="h2">RO Performance <small>(Passed Amount)</small></div>
          ${roHtml}
        </div>
      </div>

      <div class="fpills">
        ${fp("All", counts.All)}${fp("Pending", counts.Pending)}${fp("Assigned", counts.Assigned)}${fp("Verified", counts.Verified)}${fp("Passed", counts.Passed)}${fp("Rejected", counts.Rejected)}
      </div>

      <div class="frow">
        <div class="search">${ico("search", 18, "#64748b")}<input id="sq" placeholder="Search by name, mobile, RO, product..." value="${esc(q)}" oninput="q=this.value;renderTable()"></div>
        <div class="dds">
          <select id="fro" onchange="fRo=this.value;renderTable()"><option value="">All RO</option>${roList.map(n => `<option ${fRo === n ? "selected" : ""}>${esc(n)}</option>`).join("")}</select>
          <select id="fpr" onchange="fProd=this.value;renderTable()"><option value="">All Product</option>${prodList.map(p => `<option ${fProd === p ? "selected" : ""}>${p}</option>`).join("")}</select>
          <select id="fst" onchange="fStat=this.value;renderTable()"><option value="">All Status</option>${["Pending", "Assigned", "Verified", "Passed", "Rejected"].map(s => `<option ${fStat === s ? "selected" : ""}>${s}</option>`).join("")}</select>
          <button class="fbtn" onclick="resetFilters()">${ico("filter", 20, "#fff")}</button>
        </div>
      </div>

      <div class="tw"><div id="tbl"></div></div>`;
    applyIcons();
    renderTable();
  }

  function setFilter(f) { filter = f; renderDash(); }
  function resetFilters() { q = ""; fRo = ""; fProd = ""; fStat = ""; filter = "All"; renderDash(); }

  function filteredRecords() {
    const term = q.trim().toLowerCase();
    return recs.filter(r => {
      const st = statusOf(r);
      if (filter !== "All" && st !== filter) return false;
      if (fStat && st !== fStat) return false;
      if (fRo && !same(r.Staff, fRo)) return false;
      if (fProd && prodOf(r).toUpperCase() !== fProd) return false;
      if (term) {
        const hay = [cname(r), mobile(r), r.Staff, prodOf(r)].join(" ").toLowerCase();
        if (!hay.includes(term)) return false;
      }
      return true;
    });
  }

  function renderTable() {
    const box = $("tbl");
    if (!box) return;
    const list = filteredRecords();
    const rows = list.map((r, i) => {
      const st = statusOf(r);
      const pa = r.Result === "Passed" ? rs(r["Passed Amount"]) : "-";
      return `
        <tr>
          <td>${i + 1}</td>
          <td><b>${esc(cname(r))}</b><small>${esc(mobile(r))}</small></td>
          <td><b>${esc(r.Staff || "-")}</b><small>Center: ${esc(centerOf(r) || "-")}</small></td>
          <td><span class="chip" style="${prodStyle(prodOf(r))}">${esc(prodOf(r) || "-")}</span></td>
          <td>${rs(r["Requested Amount"])}</td>
          <td>${pa}</td>
          <td><span class="sp s-${st}">${st}</span><small>${esc(r.Date || "")} ${esc(r.Time || "")}</small></td>
          <td><button class="ib" onclick="openDetail('${r.ID}')">${ico("eye", 16, "#1d4ed8")}</button>${ico("dots", 16, "#64748b")}</td>
        </tr>`;
    }).join("");
    box.innerHTML = `
      <table class="t">
        <tr><th>SI</th><th>Client name<br>Mobile</th><th>RO | Center</th><th>Product</th><th>Requested</th><th>Passed</th><th>Status</th><th>Action</th></tr>
        ${rows || `<tr><td colspan="8" style="padding:14px;color:#475569">No clients match.</td></tr>`}
      </table>`;
    applyIcons();
  }

  function prodStyle(p) {
    const s = String(p).toUpperCase();
    if (s === "IGL") return "background:#dbeafe;color:#1e40af";
    if (s === "IL") return "background:#ffedd5;color:#9a3412";
    if (s === "MSME") return "background:#dcfce7;color:#166534";
    return "background:#f1f5f9;color:#334155";
  }

  // ---------- + : GRT / PD clients to act on ----------
  function renderAdd() {
    const list = recs.filter(r => ["Pending", "Assigned", "Verified"].includes(statusOf(r)))
      .sort((a, b) => b.ID - a.ID);
    $("view").innerHTML = `
      <div class="h2">GRT / PD clients <small>(tap a client to act)</small></div>
      ${list.map(r => clientCard(r, true)).join("") || `<div class="card">No clients waiting for action.</div>`}`;
  }

  // Client card with the four status chips: Verified, Assigned, Passed, Rejected
  function clientCard(r, withOpen) {
    const st = statusOf(r);
    const chips = ["Verified", "Assigned", "Passed", "Rejected"].map(s =>
      `<span class="chipS ${st === s ? "on " + s : ""}">${s}</span>`).join("");
    return `
      <div class="cli">
        <div class="top">
          <div><b>${esc(cname(r))}</b><small>${esc(mobile(r))} &middot; ${esc(r.Staff || "-")}</small></div>
          <span class="sp s-${st}">${st}</span>
        </div>
        <div class="chips">${chips}</div>
        ${withOpen ? `<button class="openBtn" onclick="openDetail('${r.ID}')">Open client</button>` : ""}
      </div>`;
  }

  // ---------- Clients: all client details ----------
  function renderClients() {
    const list = recs.slice().sort((a, b) => b.ID - a.ID);
    $("view").innerHTML = `
      <div class="h2">All GRT / PD client details <small>(${list.length} clients)</small></div>
      ${list.map(r => `
        <div class="cli">
          <div class="top">
            <div><b>${esc(cname(r))}</b><small>${esc(mobile(r))} &middot; ${esc(r.Staff || "-")}</small></div>
            <span class="sp s-${statusOf(r)}">${statusOf(r)}</span>
          </div>
          <div class="kv">${detailRows(r).map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join("")}</div>
          <button class="openBtn" onclick="openDetail('${r.ID}')">Open to act</button>
        </div>`).join("") || `<div class="card">No clients yet.</div>`}`;
  }

  // All fields for a client
  function detailRows(r) {
    const d = det(r);
    const rows = [
      ["Type", r.Type], ["RO", r.Staff], ["Product", prodOf(r)], ["Center No", d.center || r.Center],
      ["Cycle", d.cycle], ["Mobile", mobile(r)], ["Correct place", d.place], ["Available time", d.avail],
      ["Requested loan", r["Requested Amount"] ? rs(r["Requested Amount"]) : ""],
      ["GRT / PD time", fmt(r["Scheduled At"] || d.scheduledAt)],
      ["Consent letter", d.consent], ["Existing arrear", d.arrear], ["IGL closing", d.closing],
      ["House", d.house], ["How to verify", d.verify], ["House vintage", d.vintage ? d.vintage + " years" : ""],
      ["Income verification", d.income], ["Centre leader", d.leader], ["Leader phone", d.leaderPhone],
      ["Assigned BCM", r["Assigned BCM"]], ["Status", statusOf(r)],
      ["Passed amount", r.Result === "Passed" ? rs(r["Passed Amount"]) : ""],
      ["Reject reason", r["Reject Reason"]],
      ["BRM disbursed", r.Result === "Passed" ? (r.Disbursed === "Yes" ? "Yes" : (r.Disbursed === "No" ? "No" : "Not yet")) : ""]
    ];
    return rows.filter(x => x[1] !== undefined && x[1] !== null && x[1] !== "");
  }

  // ---------- Reports ----------
  function renderReports() {
    const passed = recs.filter(r => statusOf(r) === "Passed");
    const rejected = recs.filter(r => statusOf(r) === "Rejected");
    const roNames = [...new Set(recs.map(r => r.Staff).filter(Boolean))].sort();
    const roRows = roNames.map(n => {
      const mine = recs.filter(r => same(r.Staff, n));
      return `<tr><td><b>${esc(n)}</b></td><td>${mine.length}</td>
        <td>${mine.filter(r => statusOf(r) === "Passed").length}</td>
        <td>${mine.filter(r => statusOf(r) === "Rejected").length}</td>
        <td>${rs(sumOf(mine.filter(r => statusOf(r) === "Passed"), r => r["Passed Amount"]))}</td></tr>`;
    }).join("");
    $("view").innerHTML = `
      <div class="card">
        <div class="h2">Branch report</div>
        <div class="note">Passed: <b>${passed.length}</b> &nbsp;|&nbsp; Rejected: <b>${rejected.length}</b> &nbsp;|&nbsp;
          Passed amount: <b>${rs(sumOf(passed, r => r["Passed Amount"]))}</b></div>
      </div>
      <div class="tw"><table class="t" style="min-width:520px">
        <tr><th>RO</th><th>Clients</th><th>Passed</th><th>Rejected</th><th>Passed amount</th></tr>
        ${roRows || `<tr><td colspan="5" style="padding:14px">No data yet.</td></tr>`}
      </table></div>`;
  }

  // ---------- More ----------
  function renderMore() {
    $("view").innerHTML = `
      <div class="card">
        <div class="h2">Account</div>
        <div class="kv">
          <div><span>Branch</span><b>${esc(me.branch)}</b></div>
          <div><span>BCM</span><b>${esc(me.staff)}</b></div>
        </div>
        <button class="openBtn" style="background:linear-gradient(135deg,#1d4ed8,#2563eb)" onclick="manualSync()">Sync now</button>
        <button class="moreBtn" onclick="logout()">Logout</button>
      </div>`;
  }

  // ---------- CLIENT DETAILS (open a client to act) ----------
  function openDetail(id) {
    detailId = String(id);
    renderDetail();
    $("detail").style.display = "block";
    window.scrollTo(0, 0);
  }

  function closeDetail() {
    detailId = null;
    $("detail").style.display = "none";
    render();
  }

  function renderDetail() {
    const r = recs.find(x => String(x.ID) === detailId);
    if (!r) { closeDetail(); return; }
    const st = statusOf(r);
    const finished = st === "Passed" || st === "Rejected";
    const prod = prodOf(r);
    const [min, max] = rangeOf(prod);
    const chips = ["Verified", "Assigned", "Passed", "Rejected"].map(s =>
      `<span class="chipS ${st === s ? "on " + s : ""}">${s}</span>`).join("");

    let actions = "";
    if (!finished) {
      if (!isMine(r)) {
        actions = `<div class="note">Assigned to ${esc(r["Assigned BCM"])}. Only that BCM can act on this file.</div>`;
      } else {
        actions = `
          <div class="acts">
            <button class="ab ver" onclick="act('verify')">Verify</button>
            <button class="ab asg" onclick="act('take')">Assign to me</button>
            <button class="ab pas" onclick="togglePanel('pass')">Passed</button>
            <button class="ab rej" onclick="togglePanel('rej')">Rejected</button>
          </div>
          <div class="panel" id="pp" style="display:none">
            <label>Passed loan amount for ${esc(prod || "this loan")} (${rs(min)} to ${rs(max)})</label>
            <select id="pamt">${amountOptions(prod)}</select>
            <button class="ab pas full" onclick="savePassed()">Save passed amount</button>
          </div>
          <div class="panel" id="pr" style="display:none">
            <label>Rejection reason</label>
            <select id="prs">${REJECT_REASONS.map(x => `<option>${x}</option>`).join("")}</select>
            <label>Details (optional)</label>
            <input id="prt" type="text">
            <button class="ab rej full" onclick="saveRejected()">Save rejected</button>
          </div>`;
      }
    } else if (st === "Passed") {
      actions = `
        <div class="res ok">Passed: ${rs(r["Passed Amount"])}</div>
        <div class="acts" style="grid-template-columns:1fr">
          <button class="ab pas" onclick="togglePanel('amt')">Change passed amount</button>
        </div>
        <div class="panel" id="pamtp" style="display:none">
          <label>Passed loan amount for ${esc(prod || "this loan")} (${rs(min)} to ${rs(max)})</label>
          <select id="pamt">${amountOptions(prod, r["Passed Amount"])}</select>
          <button class="ab pas full" onclick="changeAmount()">Save amount</button>
        </div>`;
    } else {
      actions = `<div class="res bad">Rejected: ${esc(r["Reject Reason"] || "-")}</div>`;
    }

    $("detail").innerHTML = `
      <div class="dh">
        <button onclick="closeDetail()" style="background:none;border:none;color:#fff;cursor:pointer"><span data-ico="close" data-size="26" data-color="#fff"></span></button>
        <b>Client details</b>
      </div>
      <div class="dbody">
        <div class="dname">
          <b>${esc(cname(r))}</b>
          <small>${esc(mobile(r))} &middot; ${esc(r.Staff || "-")} &middot; ${esc(centerOf(r) || "-")}</small>
          <div class="chips">${chips}</div>
        </div>
        ${actions}
        <div class="card" style="margin-bottom:12px">
          <div class="h2">Full details</div>
          <div class="kv">${detailRows(r).map(([k, v]) => `<div><span>${k}</span><b>${esc(v)}</b></div>`).join("")}</div>
        </div>
      </div>`;
    applyIcons();
  }

  function togglePanel(which) {
    const map = { pass: "pp", rej: "pr", amt: "pamtp" };
    const target = $(map[which]);
    if (!target) return;
    const open = target.style.display === "block";
    ["pp", "pr", "pamtp"].forEach(id => { if ($(id)) $(id).style.display = "none"; });
    target.style.display = open ? "none" : "block";
  }

  async function runAction(payload) {
    try {
      const res = await post(payload);
      if (!res.ok) throw new Error(res.error);
      await loadRecords();
      renderDetail();
    } catch (e) {
      alert(e.message);
    }
  }

  function act(kind) {
    if (kind === "verify") return runAction({ action: "verify", id: detailId });
    if (kind === "take") return runAction({ action: "take", id: detailId });
  }

  function savePassed() {
    return runAction({ action: "complete", id: detailId, result: "Passed", amount: $("pamt").value });
  }

  function saveRejected() {
    const reason = $("prs").value;
    const extra = $("prt").value.trim();
    return runAction({ action: "complete", id: detailId, result: "Rejected", reason: extra ? reason + " - " + extra : reason });
  }

  function changeAmount() {
    return runAction({ action: "setamount", id: detailId, amount: $("pamt").value });
  }

  // ---------- start: restore a saved login ----------
  (function restore() {
    try {
      const s = JSON.parse(localStorage.getItem("bcm_session") || "null");
      if (s && s.token && s.role === "BCM") {
        token = s.token;
        me = { branch: s.branch, staff: s.staff, role: s.role };
        loadRecords().then(startApp).catch(() => { localStorage.removeItem("bcm_session"); });
      }
    } catch (e) {}
  })();
</script>
</body>
</html>
